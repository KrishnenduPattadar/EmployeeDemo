<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
</head>
<body>
    <h1>Products</h1>
    <ul>
        {% for product in products %}
        <li>{{ product.name }} - ${{ product.price }} - Stock: {{ product.stock }}</li>
        {% endfor %}
    </ul>
</body>
</html>
